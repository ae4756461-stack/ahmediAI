<!DOCTYPE html>
<html lang="ar" dir="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABORAYA - AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind Config -->
    <script>
      window.process = window.process || { env: { API_KEY: '' } };
      
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'Cairo', 'sans-serif'],
              cairo: ['Cairo', 'sans-serif'],
            },
            colors: {
              primary: '#6366f1',
              secondary: '#ec4899',
              dark: '#0f172a',
            },
            animation: {
              'blob': 'blob 7s infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.4s ease-out forwards',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Outfit', 'Cairo', sans-serif;
        background-color: #050505;
        color: #fff;
        overflow: hidden; 
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
      .glass-panel {
        background: rgba(17, 25, 40, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.125);
      }
      .glass-input {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
    
    <!-- Import Map for Libraries -->
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai",
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>
</head>
  <body>
    <!-- Background Animation -->
    <div class="fixed inset-0 z-[-1] overflow-hidden">
      <div class="absolute top-0 -left-4 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
      <div class="absolute top-0 -right-4 w-72 h-72 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
      <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>
    </div>
    
    <div id="root"></div>

    <!-- MAIN APP SCRIPT -->
    <script type="text/babel" data-type="module">
      import React, { useState, useRef, useEffect, useCallback } from 'react';
      import ReactDOM from 'react-dom/client';
      import { Send, Menu, Plus, X, Sparkles, MessageSquare, Settings, Zap, User } from 'lucide-react';
      import { GoogleGenAI } from "@google/genai";

      // --- CONSTANTS ---
      const APP_NAME = "ABORAYA";
      const SYSTEM_INSTRUCTION = `
You are a smart, friendly AI assistant named "ABORAYA" (أبورية).
Your role is to help the user with anything they need in a simple, respectful, and fast manner.
Provide clear and direct answers, avoiding complexity.
If the user asks for content writing, coding, advice, or information — do it immediately.

Characteristics of Aboraya:
1. Speak Egyptian Arabic if the user speaks Arabic (use terms like "يا باشا", "يا ريس", "من عينيا", "تحت أمرك" naturally but respectfully).
2. Provide simple and easy solutions.
3. Avoid inappropriate or offensive language completely.
4. Always suggest alternative solutions if something is not possible.
5. Maintain a respectful and calm tone.
6. If the user speaks English, respond in helpful, friendly English.

Start every new session or major interaction with a very brief, friendly welcome before diving into the solution.
`;

      // --- TYPES ---
      const Role = {
        USER: 'user',
        MODEL: 'model'
      };

      // --- COMPONENTS ---

      // 1. Logo Component
      const Logo = ({ className = "" }) => (
        <div className={`relative w-8 h-8 flex items-center justify-center ${className} select-none`}>
          <div className="absolute inset-0 bg-gradient-to-tr from-indigo-500 to-pink-500 rounded-lg transform rotate-6 opacity-75"></div>
          <div className="absolute inset-0 bg-gradient-to-bl from-indigo-600 to-purple-600 rounded-lg flex items-center justify-center text-white shadow-lg z-10 border border-white/10">
            <span className="font-bold font-cairo text-lg leading-none mt-[-2px]">A</span>
          </div>
        </div>
      );

      // 2. Chat Message Bubble
      const ChatMessageBubble = ({ message }) => {
        const isUser = message.role === Role.USER;

        return (
          <div className={`flex w-full ${isUser ? 'justify-end' : 'justify-start'} mb-6 group animate-slide-up`}>
            {!isUser && (
              <div className="flex-shrink-0 mr-3 mt-1">
                <Logo />
              </div>
            )}

            <div
              className={`max-w-[85%] sm:max-w-[75%] rounded-2xl px-5 py-4 text-sm sm:text-base leading-relaxed whitespace-pre-wrap shadow-md transition-all duration-300 ${
                isUser
                  ? 'bg-gradient-to-r from-violet-600 to-indigo-600 text-white rounded-br-sm shadow-indigo-500/20'
                  : message.isError 
                    ? 'bg-red-500/10 border border-red-500/30 text-red-200 rounded-bl-sm'
                    : 'bg-white/5 border border-white/10 text-gray-100 rounded-bl-sm backdrop-blur-md hover:bg-white/10'
              }`}
              dir="auto"
            >
              {message.text}
            </div>

            {isUser && (
              <div className="flex-shrink-0 ml-3 mt-1">
                 <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-pink-500 to-rose-500 flex items-center justify-center shadow-lg shadow-pink-500/20">
                  <User size={18} className="text-white" />
                </div>
              </div>
            )}
          </div>
        );
      };

      // 3. Typing Indicator
      const TypingIndicator = () => {
        return (
          <div className="flex w-full justify-start mb-6 animate-fade-in">
             <div className="flex-shrink-0 mr-3 mt-1">
                <Logo />
              </div>
            <div className="bg-white/5 border border-white/10 rounded-2xl rounded-bl-sm px-4 py-4 flex items-center space-x-1.5 backdrop-blur-sm">
              <div className="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></div>
              <div className="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></div>
              <div className="w-2 h-2 bg-pink-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></div>
            </div>
          </div>
        );
      };

      // --- SERVICE LOGIC ---
      const apiKey = process.env.API_KEY || '';
      const ai = new GoogleGenAI({ apiKey });

      const createChatSession = () => {
        if (!apiKey) throw new Error("API Key is missing");
        return ai.chats.create({
          model: 'gemini-2.5-flash',
          config: {
            systemInstruction: SYSTEM_INSTRUCTION,
            temperature: 0.7,
          },
        });
      };

      // --- MAIN APP COMPONENT ---
      const App = () => {
        const [messages, setMessages] = useState([]);
        const [inputValue, setInputValue] = useState('');
        const [isLoading, setIsLoading] = useState(false);
        const [isSidebarOpen, setIsSidebarOpen] = useState(false);

        const chatSessionRef = useRef(null);
        const messagesEndRef = useRef(null);

        useEffect(() => {
          startNewChat();
        }, []);

        useEffect(() => {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [messages, isLoading]);

        const startNewChat = useCallback(() => {
          try {
            chatSessionRef.current = createChatSession();
          } catch (e) {
            console.warn("API Key might be missing.");
          }
          
          setMessages([
            {
              id: 'welcome',
              role: Role.MODEL,
              text: 'أهلاً يا ريس! معاك "أبورية".\nجاهز لأي مهمة، كتابة، برمجة، أو حتى دردشة رايقة. تحب نبدأ بإيه؟',
              timestamp: new Date()
            }
          ]);
          setIsLoading(false);
          if (window.innerWidth < 768) setIsSidebarOpen(false);
        }, []);

        const handleSendMessage = async () => {
          if (!inputValue.trim() || isLoading) return;
          
          if (!chatSessionRef.current) {
              setMessages(prev => [...prev, {
                  id: Date.now().toString(),
                  role: Role.MODEL,
                  text: "يا ريس، شكلك نسيت تحط مفتاح الـ API. \nلازم تضيفه في الكود (process.env.API_KEY) عشان أقدر أرد عليك.",
                  timestamp: new Date(),
                  isError: true
              }]);
              return;
          }

          const userText = inputValue.trim();
          setInputValue('');
          
          const userMessage = {
            id: Date.now().toString(),
            role: Role.USER,
            text: userText,
            timestamp: new Date()
          };
          
          setMessages(prev => [...prev, userMessage]);
          setIsLoading(true);

          const botMessageId = (Date.now() + 1).toString();
          let accumulatedText = '';

          try {
            const result = await chatSessionRef.current.sendMessageStream({ message: userText });
            
            setMessages(prev => [
              ...prev,
              {
                id: botMessageId,
                role: Role.MODEL,
                text: '',
                timestamp: new Date()
              }
            ]);

            for await (const chunk of result) {
              if (chunk.text) {
                accumulatedText += chunk.text;
                setMessages(prev => 
                  prev.map(msg => 
                    msg.id === botMessageId 
                      ? { ...msg, text: accumulatedText }
                      : msg
                  )
                );
              }
            }
          } catch (error) {
            console.error("Error:", error);
            setMessages(prev => [
              ...prev,
              {
                id: Date.now().toString(),
                role: Role.MODEL,
                text: "معلش يا كبير، النت عملها معايا أو الـ API Key فيه مشكلة. ممكن نجرب تاني؟",
                timestamp: new Date(),
                isError: true
              }
            ]);
          } finally {
            setIsLoading(false);
          }
        };

        const handleKeyDown = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSendMessage();
          }
        };

        return (
          <div className="flex h-screen overflow-hidden text-gray-100 font-sans selection:bg-pink-500/30">
            
            {/* Sidebar Overlay */}
            {isSidebarOpen && (
              <div 
                className="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 md:hidden"
                onClick={() => setIsSidebarOpen(false)}
              />
            )}

            {/* Sidebar */}
            <aside className={`
              fixed md:static inset-y-0 left-0 z-50 w-72 transform transition-transform duration-300 ease-in-out
              ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
              flex flex-col
              glass-panel border-r-0 md:border-r border-white/10
            `}>
              <div className="p-6 flex items-center justify-between">
                 <div className="flex items-center gap-3">
                    <Logo />
                    <h1 className="text-xl font-bold font-cairo bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
                      {APP_NAME}
                    </h1>
                 </div>
                 <button onClick={() => setIsSidebarOpen(false)} className="md:hidden text-gray-400 hover:text-white">
                   <X size={24} />
                 </button>
              </div>

              <div className="px-4 mb-4">
                <button 
                  onClick={startNewChat}
                  className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2 group"
                >
                  <Plus size={20} className="group-hover:rotate-90 transition-transform" />
                  <span className="font-cairo">محادثة جديدة</span>
                </button>
              </div>

              <div className="flex-1 overflow-y-auto px-4 py-2 space-y-2">
                 <div className="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 px-2 font-cairo">التاريخ</div>
                 <button className="w-full text-right p-3 rounded-lg hover:bg-white/5 text-gray-300 text-sm flex items-center gap-3 transition-colors group">
                    <MessageSquare size={16} className="text-gray-500 group-hover:text-pink-400" />
                    <span className="truncate">أفكار لمشروع جديد</span>
                 </button>
              </div>

              <div className="p-4 border-t border-white/10 space-y-2">
                <div className="flex items-center gap-3 p-3 rounded-lg hover:bg-white/5 text-gray-400 hover:text-white cursor-pointer transition-colors">
                  <Zap size={18} />
                  <span className="text-sm font-medium">Upgrade Plan</span>
                </div>
                <div className="flex items-center gap-3 p-3 rounded-lg hover:bg-white/5 text-gray-400 hover:text-white cursor-pointer transition-colors">
                  <Settings size={18} />
                  <span className="text-sm font-medium">Settings</span>
                </div>
              </div>
            </aside>

            {/* Main Content */}
            <main className="flex-1 flex flex-col h-full relative w-full md:w-auto">
              
              {/* Header */}
              <header className="h-16 flex items-center justify-between px-4 md:px-8 border-b border-white/5 glass-panel z-10">
                <div className="flex items-center gap-3">
                  <button 
                    onClick={() => setIsSidebarOpen(true)}
                    className="md:hidden p-2 text-gray-300 hover:text-white hover:bg-white/10 rounded-lg transition-colors"
                  >
                    <Menu size={24} />
                  </button>
                  <div className="md:hidden flex items-center gap-2">
                     <Logo />
                     <span className="font-bold text-lg">ABORAYA</span>
                  </div>
                  <div className="hidden md:flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse shadow-[0_0_10px_rgba(34,197,94,0.5)]"></span>
                      <span className="text-sm text-gray-300 font-cairo">أبورية متصل وجاهز</span>
                  </div>
                </div>
              </header>

              {/* Chat Area */}
              <div className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 scroll-smooth">
                <div className="max-w-4xl mx-auto flex flex-col pb-4">
                   {messages.map((msg) => (
                     <ChatMessageBubble key={msg.id} message={msg} />
                   ))}
                   {isLoading && <TypingIndicator />}
                   <div ref={messagesEndRef} />
                </div>
              </div>

              {/* Input Area */}
              <div className="p-4 md:p-6 pb-6 md:pb-8">
                <div className="max-w-4xl mx-auto relative group">
                  <div className="absolute -inset-0.5 bg-gradient-to-r from-pink-600 to-indigo-600 rounded-[2rem] opacity-30 group-hover:opacity-60 blur transition duration-1000"></div>
                  <div className="relative flex items-end glass-input rounded-[1.8rem] transition-all">
                    <textarea
                      value={inputValue}
                      onChange={(e) => setInputValue(e.target.value)}
                      onKeyDown={handleKeyDown}
                      placeholder="اكتب هنا... اسأل أبورية عن أي حاجة"
                      className="w-full bg-transparent border-0 focus:ring-0 py-4 pl-6 pr-14 resize-none text-gray-100 placeholder-gray-400/70 leading-relaxed font-cairo"
                      rows={1}
                      style={{ minHeight: '60px', maxHeight: '150px' }}
                      dir="auto"
                    />
                    <button
                      onClick={handleSendMessage}
                      disabled={isLoading || !inputValue.trim()}
                      className={`absolute right-2 bottom-2.5 p-3 rounded-full flex items-center justify-center transition-all duration-300 ${
                        inputValue.trim() && !isLoading
                          ? 'bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-lg shadow-indigo-500/30 hover:scale-110'
                          : 'bg-white/10 text-gray-500 cursor-not-allowed'
                      }`}
                    >
                      {isLoading ? (
                        <Sparkles className="animate-spin" size={20} />
                      ) : (
                        <Send size={20} className={inputValue.trim() ? 'ml-0.5' : ''} />
                      )}
                    </button>
                  </div>
                </div>
                <div className="text-center mt-3">
                   <p className="text-[11px] text-gray-500 font-cairo">
                     أبورية مساعد ذكي، ممكن يغلط، راجع معلوماتك دايمًا.
                   </p>
                </div>
              </div>
            </main>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
